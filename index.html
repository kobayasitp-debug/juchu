<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="受注管理">
<meta name="theme-color" content="#f3f4f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>受注・製品管理</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#18202e;--muted:#667085;--line:#e4e7ec;--soft:#f8f9fb;
  --accent:#1d4ed8;--accent-weak:#e8efff;
  --urgent:#d92d20;--urgent-bg:#fff1ef;--urgent-line:#fecdca;
  --warn:#b54708;--warn-bg:#fffaeb;
  --ok:#067647;--ok-bg:#ecfdf3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --tabh:64px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#1a1d23;--ink:#e8eaed;--muted:#9aa1ad;--line:#2b3038;--soft:#14171c;
  --accent:#7aa2ff;--accent-weak:#1c2a47;
  --urgent:#ff6b5e;--urgent-bg:#3a1714;--urgent-line:#6b2620;
  --warn:#fdb022;--warn-bg:#33270c;
  --ok:#4ade80;--ok-bg:#12301f;
  --shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.ic{width:20px;height:20px;flex:none;vertical-align:middle}
.sp{flex:1}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em}
#topActions{margin-left:auto;display:flex;gap:8px}
main{padding:16px max(20px,env(safe-area-inset-right)) calc(var(--tabh) + env(safe-area-inset-bottom) + 24px) max(20px,env(safe-area-inset-left));max-width:1200px;margin:0 auto}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;height:calc(var(--tabh) + env(safe-area-inset-bottom));padding:6px 12px env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line)}
.tabbar button{flex:0 1 160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:12px;font-weight:600}
.tabbar button .ic{width:24px;height:24px}
.tabbar button.on{color:var(--accent);background:var(--accent-weak)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--urgent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.35;pointer-events:none}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:0;background:transparent}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;min-height:38px;padding:0 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent-weak);color:var(--accent)}
.seg b{font-weight:700;margin-left:4px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--urgent)}
.search-in{flex:1 1 240px;min-width:200px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 14px;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.stat{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.stat b{font-size:15px;color:var(--ink)}
.stat.red{background:var(--urgent-bg);border-color:var(--urgent-line);color:var(--urgent)}.stat.red b{color:var(--urgent)}
.stat.amber{background:var(--warn-bg);border-color:transparent;color:var(--warn)}.stat.amber b{color:var(--warn)}

/* order list */
.group-h{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.group-h:first-child{margin-top:4px}
.group-h .n{font-weight:600}
.group-h.red{color:var(--urgent)}
.orders{display:flex;flex-direction:column;gap:8px}
.order{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;padding:12px 14px 12px 12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:pointer}
.order.urgent{background:var(--urgent-bg);border-color:var(--urgent-line);border-left-color:var(--urgent)}
.order.done{opacity:.6}
.due{text-align:center;border-radius:10px;padding:8px 4px;background:var(--soft);line-height:1.2}
.due .d{font-size:24px;font-weight:800;letter-spacing:-.02em}
.due .w{font-size:12px;color:var(--muted);font-weight:600}
.due .left{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
.due.soon{background:var(--warn-bg)}.due.soon .left{color:var(--warn)}
.due.today{background:var(--urgent);color:#fff}.due.today .w,.due.today .left{color:#fff}
.due.over{background:#7a271a;color:#fff}.due.over .w,.due.over .left{color:#fff}
.ob{min-width:0}
.ob .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cust{font-size:13px;font-weight:600;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.badge.urgent{background:var(--urgent);color:#fff}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.prod{font-size:18px;font-weight:700;line-height:1.35;margin:2px 0}
.model{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-weak);padding:1px 7px;border-radius:6px;margin-left:6px;white-space:nowrap}
.qty{font-size:15px;font-weight:700;margin-left:8px;white-space:nowrap}
.meta{font-size:13px;color:var(--muted)}
.meta span+span::before{content:"・";margin:0 4px}
.note{font-size:13px;color:var(--ink);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oa{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.oa .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dbtn{min-width:88px}
.dbtn .n{font-size:12px;color:var(--muted);font-weight:700}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .ic{width:44px;height:44px;opacity:.5;margin-bottom:8px}
@media (max-width:700px){.order{grid-template-columns:76px 1fr}.oa{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.oa .row{flex:1}.due .d{font-size:20px}}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.pcard{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:pointer}
.thumb{width:84px;height:84px;border-radius:10px;background:var(--soft);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pname{font-size:17px;font-weight:700;line-height:1.35}
.pmodel{margin-top:2px}.pmodel .model{margin-left:0}
.pmeta{font-size:13px;color:var(--muted);margin-top:4px}
.pact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* forms / modal */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.5);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.modal{background:var(--card);width:min(640px,100%);max-height:100%;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{width:min(860px,100%)}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:19px}
.mbody{overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 24px}
.mfoot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--soft);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px 14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:1/-1}
@media (max-width:700px){.grid{grid-template-columns:1fr 1fr}.c2,.c3{grid-column:span 1}.c4,.c6{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>span{font-size:13px;font-weight:700;color:var(--muted)}
.f>span em{color:var(--urgent);font-style:normal}
.f>span small{font-weight:600;color:var(--accent)}
.f input,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;height:48px;font-size:17px}
.f input[type=date]{-webkit-appearance:none;appearance:none;display:flex;align-items:center}
.f textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical;line-height:1.5}
.f input:focus,.f textarea:focus,.search-in:focus,.chatbar input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.urgent-toggle{justify-content:flex-end}
.urgent-toggle input{position:absolute;opacity:0;pointer-events:none}
.urgent-toggle .box{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;border:2px dashed var(--line);font-weight:700;color:var(--muted);font-size:16px}
.urgent-toggle input:checked+.box{background:var(--urgent);border:2px solid var(--urgent);color:#fff}
.linkinfo{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--muted)}
.linkinfo b{color:var(--ink)}
.linkinfo.new{background:var(--accent-weak);color:var(--accent)}
.fs{margin-top:22px}
.fs>h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.fs>h3 small{font-weight:500;color:var(--muted);font-size:12px}
.dkind{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.dk-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dk-head b{font-size:16px}
.dk-head .count{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{position:relative;display:flex;align-items:center;gap:8px;padding:6px 36px 6px 6px;border:1px solid var(--line);border-radius:10px;background:var(--soft);max-width:260px;cursor:pointer}
.chip.noedit{padding-right:12px}
.chip .t{width:44px;height:44px;border-radius:6px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.chip .t img{width:100%;height:100%;object-fit:cover}
.chip .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .x{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.empty{font-size:13px;color:var(--muted)}
.url{margin-top:4px}
.url input{height:42px;font-size:15px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ph{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.ph .x .ic{width:16px;height:16px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.hist th{font-size:12px;color:var(--muted)}
.picker{display:flex;flex-direction:column;gap:8px}
.picker .chip{max-width:none;padding-right:12px}

/* viewer */
.viewer-wrap{padding:0;background:#000}
.viewer-wrap .modal{width:100%;height:100%;max-height:100%;border-radius:0;background:#000;position:relative}
.viewer{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}
.vbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;z-index:2}
.vbar .icon-btn{color:#fff;background:rgba(255,255,255,.12)}
.vbar .cnt{font-size:14px;font-weight:600}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.vnav.l{left:12px}.vnav.r{right:12px}

/* search / chat */
body[data-tab=search] main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 90px)}
.chat{display:flex;flex-direction:column;gap:14px;max-width:900px;margin:0 auto}
.msg{max-width:100%}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;padding:10px 16px;border-radius:18px 18px 4px 18px;font-size:17px;font-weight:600;max-width:80%}
.msg.bot{align-self:flex-start;width:100%}
.msg.bot .say{display:inline-block;background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:18px 18px 18px 4px;font-size:15px;margin-bottom:8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.rcard{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.rcard .thumb{width:96px;height:96px}
.rmeta{font-size:13px;color:var(--muted);margin-top:4px}
.rmeta .act{color:var(--urgent);font-weight:700}
.rbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chatbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:25;display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--bg);border-top:1px solid var(--line)}
.chatbar .inner{display:flex;gap:8px;width:100%;max-width:900px;margin:0 auto}
.chatbar input{flex:1;height:52px;border-radius:26px;border:1px solid var(--line);background:var(--card);padding:0 20px;font-size:17px;min-width:0}
.round{width:52px;height:52px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex:none}
.round .ic{width:24px;height:24px}
.mic{background:var(--card);border:1px solid var(--line)!important;color:var(--accent)}
.mic.rec{background:var(--urgent);color:#fff;border-color:var(--urgent)!important;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,45,32,.5)}70%{box-shadow:0 0 0 14px rgba(217,45,32,0)}100%{box-shadow:0 0 0 0 rgba(217,45,32,0)}}
.send{background:var(--accent);color:#fff}

/* settings */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 6px;font-size:16px}
.panel p{margin:4px 0 12px;color:var(--muted);font-size:14px}
.kv{display:flex;flex-wrap:wrap;gap:8px 28px;margin:8px 0 4px}
.kv div{font-size:13px;color:var(--muted)}
.kv b{display:block;font-size:20px;color:var(--ink)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--ink)}
.steps li{margin:4px 0}

/* 写真から自動入力 */
.ocr-cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;margin-bottom:18px;border-radius:12px;background:var(--accent-weak)}
.ocr-cta span{font-size:13px;color:var(--accent);font-weight:600}
.ocr-stage{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center;margin:14px 0}
.ocr-stage img{width:140px;height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft)}
.ocr-status .st{font-size:14px;font-weight:600;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.ocr-text textarea{font-size:15px;min-height:140px}
.tip{margin:10px 0 4px;font-size:14px}
.tip summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
h3.sub{margin:22px 0 10px;font-size:15px}
.f.got input,.f.got .proc-btn{background:var(--ok-bg);border-color:transparent}
.proc-btn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;min-height:48px;padding:6px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;text-align:left;font-size:17px}
.proc-btn .ph-t{color:var(--muted);font-size:16px}
.proc-btn .ic{margin-left:auto;color:var(--muted)}
.ptag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-size:14px;font-weight:700;white-space:nowrap}
.prod .ptag{font-size:13px;margin-right:6px;vertical-align:3px}
.proc-list{display:flex;flex-direction:column;gap:10px}
.proc-opt{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 18px;border:2px solid var(--line);border-radius:12px;font-size:19px;font-weight:700;cursor:pointer}
.proc-opt input{width:28px;height:28px;accent-color:var(--accent);flex:none}
.proc-opt:has(input:checked){border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.f.guess input{background:var(--warn-bg);outline:2px solid var(--warn);outline-offset:-2px}
.f>span em{font-weight:600}
.matchinfo{margin:10px 0 4px;font-size:14px}
.matchinfo .ok{color:var(--ok);font-weight:700}
.matchinfo .nw{color:var(--accent);font-weight:600}
.ocr-opts{display:flex;flex-direction:column;gap:0;margin-top:6px}
.ocr-opts .chk input{accent-color:var(--accent)}

/* ===== PC表示 ===== */
html[data-layout=pc] .only-tab{display:none!important}
html:not([data-layout=pc]) .only-pc{display:none!important}
html[data-layout=pc]{--side:200px;--tabh:0px}
html[data-layout=pc] .tabbar{top:0;right:auto;width:var(--side);height:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line)}
html[data-layout=pc] .tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 14px;font-size:15px;border-radius:10px}

.yst.new{background:var(--ok-bg);color:var(--ok)}.yst.dup{background:var(--soft);color:var(--muted)}.yst.upd{background:var(--accent-weak);color:var(--accent)}.yst.ng{background:var(--urgent-bg);color:var(--urgent)}
.src{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}

#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);background:#1d2433;color:#fff;padding:12px 20px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

<body data-tab="orders">
<header class="topbar"><h1 id="title">注文</h1><div id="topActions"></div></header>
<main id="view"></main>
<nav class="tabbar" id="tabbar"></nav>
<div id="modalRoot"></div>
<div id="toast" role="status"></div>
<datalist id="dlCust"></datalist><datalist id="dlName"></datalist><datalist id="dlModel"></datalist>

<script>
'use strict';
/* ========== 基本ユーティリティ ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const toStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>toStr(new Date());
const parseD=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD='日月火水木金土';
const fmtMD=s=>{const d=parseD(s);return d?`${d.getMonth()+1}/${d.getDate()}`:'—'};
const fmtFull=s=>{const d=parseD(s);return d?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`:'—'};
const wd=s=>{const d=parseD(s);return d?WD[d.getDay()]:''};
const daysLeft=s=>{const d=parseD(s);if(!d)return null;return Math.round((d-parseD(today()))/86400000)};
const KIND={iron:'鉄心',lining:'ライニング'};

const ICONS={
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/>',
 box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
 search:'<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>',
 gear:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
 link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 mic:'<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>',
 send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
 trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
 flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
 left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
 down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 chev:'<path d="m6 9 6 6 6-6"/>',
 ext:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/>',
};
const I=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}

/* ========== 検索用の文字正規化 ========== */
const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function norm(s){return kata2hira(String(s??'').normalize('NFKC').toLowerCase()).replace(/[\s\-‐‑–—―_.,、。・\/\\()（）「」]/g,'')}
// 音声で「エービー」などと読まれた英字を置き換える（長い読みから順に）
const ALPHA=[['はいふん',''],['まいなす',''],['だぶりゅー','w'],['だぶる','w'],['えっくす','x'],['えいち','h'],['えっち','h'],['じぇー','j'],['じぇい','j'],['きゅー','q'],['あーる','r'],['ぜっと','z'],['ぜっど','z'],['てぃー','t'],['でぃー','d'],['えー','a'],['えい','a'],['びー','b'],['しー','c'],['いー','e'],['えふ','f'],['じー','g'],['あい','i'],['けー','k'],['けい','k'],['える','l'],['えむ','m'],['えぬ','n'],['おー','o'],['ぴー','p'],['えす','s'],['ゆー','u'],['ぶい','v'],['ゔぃ','v'],['わい','y']];
const spokenAlpha=q=>{let s=q;for(const[k,v]of ALPHA)s=s.split(k).join(v);return s};
const cleanQuery=q=>{let s=String(q).trim(),prev;do{prev=s;s=s.replace(/[。．.!！?？]+$/,'').replace(/(を|の)?(探して|さがして|検索して|検索|けんさく|調べて|しらべて|見せて|みせて|出して|だして|表示して|表示|図面|ずめん|写真|しゃしん)(ください|下さい)?$/,'').trim()}while(s!==prev&&s);return s||String(q).trim()};
const bigrams=s=>{const a=[];for(let i=0;i<s.length-1;i++)a.push(s.slice(i,i+2));return a};
function dice(a,b){if(!a||!b)return 0;if(a.length<2||b.length<2)return a===b?1:0;const A=bigrams(a),B=bigrams(b),m=new Map;A.forEach(x=>m.set(x,(m.get(x)||0)+1));let c=0;B.forEach(x=>{const n=m.get(x);if(n){c++;m.set(x,n-1)}});return 2*c/(A.length+B.length)}

/* ========== データベース（iPad内に保存） ========== */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('kanri',1);r.onupgradeneeded=()=>{const d=r.result;['orders','products','files'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 run(store,mode,fn){return new Promise((res,rej)=>{const t=DB.db.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 all:s=>DB.run(s,'readonly',st=>st.getAll()),
 get:(s,id)=>DB.run(s,'readonly',st=>st.get(id)),
 put:(s,v)=>DB.run(s,'readwrite',st=>st.put(v)),
 del:(s,id)=>DB.run(s,'readwrite',st=>st.delete(id)),
 clear:s=>DB.run(s,'readwrite',st=>st.clear()),
 keys:s=>DB.run(s,'readonly',st=>st.getAllKeys()),
};
const urlCache=new Map();
async function storeFile(blob,name){const id=uid();await DB.put('files',{id,blob,name:name||'',type:blob.type||'',size:blob.size,createdAt:Date.now()});return{id,name:name||'',type:blob.type||''}}
async function fileURL(id){if(urlCache.has(id))return urlCache.get(id);const r=await DB.get('files',id);if(!r)return null;const u=URL.createObjectURL(r.blob);urlCache.set(id,u);return u}
function hydrate(root=document){$$('img[data-fid]',root).forEach(img=>{if(img.getAttribute('src'))return;fileURL(img.dataset.fid).then(u=>{if(u)img.src=u})})}
const isImg=t=>/^image\//.test(t||'');

async function compress(file,max=1600,q=.82){
 if(!isImg(file.type)||file.type==='image/gif'||file.type==='image/svg+xml')return file;
 try{
  const u=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
  let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));return b||file;
 }catch(e){return file}
}
function pickFiles({accept='image/*',capture=false,multiple=true}={}){
 return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;if(capture)i.setAttribute('capture','environment');i.multiple=multiple;i.style.display='none';document.body.appendChild(i);
  i.addEventListener('change',()=>{res([...i.files]);i.remove()});i.addEventListener('cancel',()=>{res([]);i.remove()});i.click()});
}
async function photosFromFiles(fs){const ids=[];for(const f of fs){if(!isImg(f.type))continue;const b=await compress(f,1600,.82);ids.push((await storeFile(b,f.name||'写真.jpg')).id)}return ids}
async function addPhotos(capture){return photosFromFiles(await pickFiles({accept:'image/*',capture,multiple:!capture}))}
async function addDrawingFiles(kind,capture){return drawingsFromFiles(kind,await pickFiles({accept:capture?'image/*':'image/*,application/pdf',capture,multiple:!capture}))}
async function drawingsFromFiles(kind,fs){
 const out=[];
 for(const f of fs){if(!isImg(f.type)&&f.type!=='application/pdf')continue;const b=isImg(f.type)?await compress(f,3000,.9):f;const s=await storeFile(b,f.name||(KIND[kind]+'図面'));out.push({id:uid(),kind,fileId:s.id,name:f.name||(KIND[kind]+'図面.jpg'),type:b.type||f.type})}
 return out;
}

/* ---- ドラッグ＆ドロップ（PC） ---- */
const hasFiles=e=>!!(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'));
function enableDrop(root,sel,fn){
 root.addEventListener('dragover',e=>{if(!hasFiles(e))return;const z=e.target.closest(sel);if(!z||!root.contains(z))return;e.preventDefault();e.dataTransfer.dropEffect='copy';$$('.drop-on',root).forEach(x=>x!==z&&x.classList.remove('drop-on'));z.classList.add('drop-on')});
 root.addEventListener('dragleave',e=>{const z=e.target.closest(sel);if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-on')});
 root.addEventListener('drop',e=>{if(!hasFiles(e))return;const z=e.target.closest(sel);if(!z||!root.contains(z))return;e.preventDefault();e.stopPropagation();z.classList.remove('drop-on');const fs=[...e.dataTransfer.files];if(fs.length)fn(z,fs)});
}

/* ========== 状態 ========== */
const state={tab:'orders',orders:[],products:[],orderFilter:'open',orderText:'',urgentTop:false,prodText:'',chat:[]};
try{const p=JSON.parse(localStorage.getItem('kanri-ui')||'{}');if(p.urgentTop)state.urgentTop=true;if(p.orderFilter)state.orderFilter=p.orderFilter}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('kanri-ui',JSON.stringify({urgentTop:state.urgentTop,orderFilter:state.orderFilter}))}catch(e){}};
const prodById=id=>id?state.products.find(p=>p.id===id):null;
function findProductBy(name,model){
 const nm=norm(model);if(nm)return state.products.find(p=>norm(p.model)===nm)||null;
 const nn=norm(name);if(nn)return state.products.find(p=>!norm(p.model)&&norm(p.name)===nn)||state.products.find(p=>norm(p.name)===nn)||null;
 return null;
}
function prevOrderOf(prodId,excludeId,before,created=Infinity){let best='';for(const o of state.orders){if(o.id===excludeId||o.productId!==prodId||!o.orderDate)continue;if(before&&(o.orderDate>before||(o.orderDate===before&&(o.createdAt||0)>=created)))continue;if(o.orderDate>best)best=o.orderDate}return best}
const ordersOf=pid=>state.orders.filter(o=>o.productId===pid).sort((a,b)=>(b.orderDate||'').localeCompare(a.orderDate||''));
const upsert=(arr,obj)=>{const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)};
function refreshDatalists(){
 const u=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'ja'));
 $('#dlCust').innerHTML=u(state.orders.map(o=>o.customer)).map(v=>`<option value="${esc(v)}">`).join('');
 $('#dlName').innerHTML=u(state.products.map(p=>p.name)).map(v=>`<option value="${esc(v)}">`).join('');
 $('#dlModel').innerHTML=u(state.products.map(p=>p.model)).map(v=>`<option value="${esc(v)}">`).join('');
}
async function gcFiles(){
 if($('#modalRoot [data-sticky]'))return;
 try{const ref=new Set();state.orders.forEach(o=>(o.photos||[]).forEach(i=>ref.add(i)));state.products.forEach(p=>{(p.photos||[]).forEach(i=>ref.add(i));(p.drawings||[]).forEach(d=>ref.add(d.fileId))});
  for(const k of await DB.keys('files'))if(!ref.has(k)){await DB.del('files',k);const u=urlCache.get(k);if(u){URL.revokeObjectURL(u);urlCache.delete(k)}}}catch(e){console.warn(e)}
}

/* ========== モーダル ========== */
function openModal(html,{wide=false,sticky=false,cls=''}={}){
 const w=document.createElement('div');w.className='modal-wrap '+cls;if(sticky)w.dataset.sticky='1';
 w.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
 $('#modalRoot').appendChild(w);document.body.classList.add('noscroll');
 w.addEventListener('click',e=>{if(e.target===w&&!sticky)closeModal(w);if(e.target.closest('[data-close]'))closeModal(w)});

function pickModel(name,code,spec){
 const isTok=t=>t.length>=4&&/^[A-Za-z0-9][A-Za-z0-9\-_.]*$/.test(t)&&/[A-Za-z]/.test(t)&&/\d/.test(t)&&!/^\d+(\.\d+)?[A-Za-z]{1,3}$/.test(t);
 const sp=String(spec||'').normalize('NFKC').trim();if(sp&&isTok(sp))return sp;
 const toks=String(name||'').normalize('NFKC').split(new RegExp(`[\\s()（）［］\\[\\]、,，/*×φΦ]+|${JCH}+`)).map(t=>t.replace(/^[.\-_]+|[.\-_]+$/g,'')).filter(isTok);
 const cn=String(code||'').normalize('NFKC'),cs=norm(cn.replace(/^[A-Za-z]-/,''));
 if(cs.length>=4){const hit=toks.find(t=>{const n=norm(t);return n.length>=4&&(n===cs||(cs.includes(n)&&n.length>=cs.length*.6)||(n.includes(cs)&&cs.length>=n.length*.6))});if(hit)return hit}
 const hy=toks.filter(t=>t.includes('-')&&t.length>=8).sort((a,b)=>b.length-a.length);if(hy.length)return hy[0];
 if(toks.length)return [...toks].sort((a,b)=>b.length-a.length)[0];
 return cn;
}
const jn=v=>String(v??'').normalize('NFKC').replace(/\s+/g,' ').trim();
function buildFromCSV(rows,map,hasHeader){
 const data=hasHeader?rows.slice(1):rows,get=(r,k)=>map[k]>=0?String(r[map[k]]??'').trim():'',out=[],lineCount={};
 for(const r of data){
  const no=get(r,'orderNo'),name=jn(get(r,'itemName')),code=jn(get(r,'itemCode')),spec=jn(get(r,'spec')),qty=numClean(get(r,'qty'));
  if(!name&&!code&&!spec)continue;
  // 商品コードも型番も数量もない行は「摘要行」→ 同じ伝票の直前の明細の備考へ
  const last=out[out.length-1];
  if(!code&&!spec&&!qty&&last&&last.no===no){last.extra.push(name);continue}
  lineCount[no]=(lineCount[no]||0)+1;
  const ln=get(r,'lineNo')||code||String(lineCount[no]);
  const model=pickModel(name,code,spec);
  const process=PROCESSES.filter(k=>PROC_RE[k].test(name+' '+spec));
  let pname=name;if(model)pname=pname.split(model).join(' ');PROCESSES.forEach(k=>{pname=pname.replace(PROC_RE[k],' ')});pname=pname.replace(/\s+/g,' ').replace(/^[\s・,、\/()（）]+|[\s・,、\/()（）]+$/g,'').trim();
  const memo=jn(get(r,'memo')),note=jn(get(r,'note')),dest=jn(get(r,'dest')),con=jn(get(r,'custOrderNo')),size=jn(get(r,'size')),lin=jn(get(r,'lining')),rem=numClean(get(r,'remain'));
  const ex=[con?'注文番号 '+con:'',size&&/\d/.test(size)&&norm(size)!==norm(model)?'寸法 '+size:'',lin&&/\d/.test(lin)?'使用ライニング '+lin:'',memo,note,dest?'納入先 '+dest:''].filter(Boolean);
  out.push({no,ln,key:no?`${no}-${ln}`:'',customer:jn(get(r,'custName'))||get(r,'custCode'),model,pname,process,qty,code,
   orderDate:parseDateAny(get(r,'orderDate')),dueDate:parseDateAny(get(r,'dueDate')),itemName:name,done:map.remain>=0&&rem==='0',
   fee:FEE_RE.test(name),extra:ex,urgent:/(大至急|至急|特急|急ぎ|緊急)/.test([memo,note,name].join(' '))});
 }
 // 緊急対応費・送料などの付帯費用は、同じ受注番号の明細にまとめる（緊急なら「急ぎ」にする）
 for(const f of out.filter(x=>x.fee)){const sib=out.filter(x=>!x.fee&&x.no&&x.no===f.no);
  if(sib.length){f.merged=true;sib.forEach(x=>{x.extra.push(f.itemName);if(/(緊急|至急|特急)/.test(f.itemName))x.urgent=true})}}
 return out.filter(x=>!x.merged);
}

function dueBlock(o){

function searchProducts(raw){
 const q=cleanQuery(raw);const nq=norm(q);if(!nq)return{hits:[],fuzzy:false,q};
 const vs=[...new Set([nq,spokenAlpha(nq)])];const hits=[];
 for(const p of state.products){const nm=norm(p.model),nn=norm(p.name);let s=0;
  for(const v of vs){
   if(nm){if(nm===v)s=Math.max(s,100);else if(nm.startsWith(v))s=Math.max(s,85);else if(nm.includes(v))s=Math.max(s,70);else if(nm.length>=3&&v.includes(nm))s=Math.max(s,75)}
   if(nn){if(nn===v)s=Math.max(s,95);else if(nn.includes(v))s=Math.max(s,60);else if(nn.length>=2&&v.includes(nn))s=Math.max(s,55)}
  }
  if(s)hits.push({p,s});
 }
 if(hits.length)return{hits:hits.sort((a,b)=>b.s-a.s||(a.p.name||'').localeCompare(b.p.name||'','ja')).slice(0,20),fuzzy:false,q};
 for(const p of state.products){const s=Math.max(...vs.map(v=>Math.max(dice(v,norm(p.model)),dice(v,norm(p.name)))));if(s>=.34)hits.push({p,s})}

const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function dataURLtoBlob(u){const[h,d]=u.split(',');const type=(h.match(/data:([^;]*)/)||[])[1]||'';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type})}

 if(typing(e)||e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
 if(e.key==='n'||e.key==='N'){e.preventDefault();openOrderForm(null)}
 else if(e.key==='/'){const i=$('#orderText')||$('#prodText')||$('#chatIn');if(i){e.preventDefault();i.focus()}}
 else if(/^[1-4]$/.test(e.key)){if(rec)rec.stop();state.tab=TABS[+e.key-1][0];window.scrollTo(0,0);render()}
});
/* ---- 注文一覧に注文書の画像をドロップ → 読み取って登録 ---- */
addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();if(state.tab==='orders'&&!$('#modalRoot').children.length)document.body.classList.add('dropping')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dropping')});
addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();document.body.classList.remove('dropping');if($('#modalRoot').children.length||state.tab!=='orders')return;const fs=[...e.dataTransfer.files],csv=fs.find(f=>/\.(csv|txt|tsv)$/i.test(f.name||'')||/csv/.test(f.type||''));if(csv){openYayoiImport(csv);return}const f=fs.find(f=>isImg(f.type));if(f)openOrderForm(null,{ocr:true,ocrFile:f});else toast('注文書の画像（JPEG・PNG）か、弥生のCSVをドロップしてください')});
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-action]');if(!el||el.closest('[data-sticky]'))return;
 const a=el.dataset.action,id=el.dataset.id;
 switch(a){
  case 'new-order':openOrderForm(null);break;
  case 'new-order-ocr':openOrderForm(null,{ocr:true});break;
  case 'yayoi':openYayoiImport();break;
  case 'edit-order':openOrderForm(state.orders.find(o=>o.id===id));break;
  case 'new-order-for':openOrderForm(null,{productId:id});break;
  case 'new-product':openProductForm(null);break;
  case 'edit-product':openProductForm(prodById(id));break;
  case 'quick-photo':quickPhoto(id);break;
  case 'open-drawing':openDrawings(el.dataset.pid,el.dataset.kind);break;
  case 'order-photos':{const o=state.orders.find(x=>x.id===id);if(o&&o.photos.length)openViewer(o.photos,0);break}
  case 'product-photos':{const p=prodById(id);if(p&&p.photos.length)openViewer(p.photos,0);break}
  case 'toggle-done':{const o=state.orders.find(x=>x.id===id);if(!o)break;o.done=!o.done;o.updatedAt=Date.now();await DB.put('orders',o);renderOrderList();toast(o.done?'完了にしました':'未完了に戻しました');break}
  case 'ofilter':state.orderFilter=el.dataset.v;savePrefs();$$('#oseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.orderFilter));renderOrderList();break;
  case 'suggest':runSearch(el.dataset.q);break;
  case 'clear-chat':state.chat=[];renderSearch();break;
  case 'export':exportData().catch(err=>alert('書き出しに失敗しました：'+err.message));break;
  case 'ocr-download':downloadOcr();break;
  case 'csv':exportCSV();break;
  case 'check-update':checkUpdate();break;
  case 'layout':try{localStorage.setItem('kanri-layout',el.dataset.v)}catch(err){}applyLayout();render();toast(el.dataset.v==='auto'?'画面の大きさで自動切替にしました':el.dataset.v==='pc'?'PC表示にしました':'iPad表示にしました');break;
  case 'import':importData().catch(err=>alert('復元に失敗しました：'+err.message));break;
 }
});

/* ========== 起動 ========== */
(async()=>{
 try{await DB.open();state.orders=await DB.all('orders');state.products=await DB.all('products')}
 catch(e){$('#view').innerHTML=`<div class="panel"><h3>データベースを開けませんでした</h3><p>プライベートブラウズでは使えません。通常のウィンドウ（Safari・Chrome・Edge）で開いてください。（${esc(e&&e.message)}）</p></div>`;return}
 refreshDatalists();render();gcFiles();
 // 日付が変わったら残り日数を更新
 let day=today();setInterval(()=>{if(today()!==day){day=today();if(state.tab==='orders'&&!$('#modalRoot').children.length)renderOrderList()}},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.tab==='orders'&&!$('#modalRoot').children.length)renderOrderList()});
 try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false;
  // 新しい版が入ったら自動で切り替える（入力中なら閉じたあとに）
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;
   const go=()=>{reloading=true;location.reload()};
   if(!$('#modalRoot').children.length)go();else{toast('新しい版があります。画面を閉じると自動で更新します');const t=setInterval(()=>{if(!$('#modalRoot').children.length){clearInterval(t);go()}},1000)}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
   window.__swReg=reg;
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
 }
})();
</script>
</body>
</html>
